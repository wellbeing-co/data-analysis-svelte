name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Certifies that nothing identifying ever reaches the public repo. This is
  # the gate that must pass before anonymised data can be pushed - required
  # in branch protection alongside the other jobs below.
  anonymisation-check:
    name: Anonymisation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: etl

      - name: Check published CSVs contain no PII
        working-directory: etl
        run: bundle exec ruby bin/check_anonymized.rb

  ruby-security:
    name: Ruby security scan (Brakeman + bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: etl

      - name: Brakeman
        working-directory: etl
        # --force: this is a Sinatra app (tagging_web), not Rails, so Brakeman
        # needs to be told to scan it anyway; -A includes all checks.
        run: bundle exec brakeman . --force -A --no-exit-on-warn --exit-on-error

      - name: bundler-audit
        working-directory: etl
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check

  ruby-lint:
    name: Ruby lint (RuboCop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: etl

      - name: RuboCop
        working-directory: etl
        run: bundle exec rubocop --format github

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [ruby, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  svelte-tests:
    name: Svelte checks, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Type/svelte check
        working-directory: app
        run: npm run check

      - name: Unit tests
        working-directory: app
        run: npm run test

      - name: Build
        working-directory: app
        run: npm run build
