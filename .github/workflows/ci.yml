name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Certifies that nothing identifying ever reaches the public repo. This is
  # the gate that must pass before anonymised data can be pushed - required
  # in branch protection alongside the other jobs below.
  anonymisation-check:
    name: Anonymisation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: etl

      - name: Check output CSVs contain no PII
        working-directory: etl
        run: bundle exec ruby bin/check_anonymized.rb

  ruby-security:
    name: Ruby security scan (Brakeman + bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: etl

      - name: Brakeman
        working-directory: etl
        # --force: this is a Sinatra app (tagging_web), not Rails, so Brakeman
        # needs to be told to scan it anyway; -A includes all checks.
        run: bundle exec brakeman . --force -A --no-exit-on-warn --exit-on-error

      - name: bundler-audit
        working-directory: etl
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check

  ruby-lint:
    name: Ruby lint (StandardRB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: etl

      - name: StandardRB
        working-directory: etl
        run: bundle exec standardrb

  codeql:
    name: CodeQL (ruby)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ruby

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:ruby"
          upload: false
